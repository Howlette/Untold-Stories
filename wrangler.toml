# Cloudflare Pages configuration for the Untold Stories site and admin.
name = "untold-stories"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[vars]
ADMIN_HOSTS = "admin.limitedseries.net"
OWNER_EMAIL = "ed@nexgen.us"
# Starting password for the owner, stored only as a hash. It is used once, at first sign-in; change it in the admin under My account.
OWNER_PASSWORD_HASH = "pbkdf2$100000$Zpm5COj8RZZycbq2KDau2w==$myq3PvT6kIxw1g1Lt1vHg95Akos+ZiFAXrh+N04hVVo="
SUBMISSIONS_MODE = "test"
MAIL_FROM = ""

[[d1_databases]]
binding = "DB"
database_name = "untold-stories"
database_id = "73f0584c-30f3-41be-889e-4439ff3c605a"

[[r2_buckets]]
binding = "FILES"
bucket_name = "untold-stories-files"
